version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rivu_postgres
    environment:
      POSTGRES_USER: rivu
      POSTGRES_PASSWORD: rivu_dev_password
      POSTGRES_DB: rivu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivu"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalogue-postgres:
    image: postgres:16-alpine
    container_name: rivu_catalogue_postgres
    environment:
      POSTGRES_USER: rivu_catalogue
      POSTGRES_PASSWORD: ${CATALOGUE_POSTGRES_PASSWORD:?Set CATALOGUE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rivu_catalogue
    ports:
      - "5433:5432"
    volumes:
      - catalogue_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivu_catalogue"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: rivu_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/rivu-datasets --ignore-existing;
      mc anonymous set none local/rivu-datasets;
      echo 'Bucket created.';
      "

volumes:
  postgres_data:
  catalogue_postgres_data:
  minio_data:
