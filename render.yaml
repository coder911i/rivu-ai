services:
  - type: web
    name: rivu-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: CATALOGUE_DATABASE_URL
        sync: false
      - key: CATALOGUE_JWT_SECRET
        sync: false
      - key: CATALOGUE_AUTO_CREATE_SCHEMA
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: FRONTEND_URL
        value: https://rivu-ai-murex.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ALLOWED_ORIGINS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: rivu-datasets
      - key: S3_REGION
        value: us-east-1
      - key: S3_USE_SSL
        value: "true"

  - type: worker
    name: rivu-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.workers.runner
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: rivu-datasets
      - key: S3_REGION
        value: us-east-1
      - key: S3_USE_SSL
        value: "true"
